services:
  postgres:
    image: postgres:18.4
    container_name: employee-management-postgres
    environment:
      POSTGRES_DB: employee_management
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: change-me-in-production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employee_management"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
